# =============================================================================
# Third Payments API  (CONTRATO PROVISIONAL - propuesto por el equipo)
# -----------------------------------------------------------------------------
# El docente aún no entregó la tercera API. Este contrato es un SUSTITUTO para
# desarrollar y probar el envío a 3 destinos desde ya. NO es el contrato oficial.
# Cuando llegue el real: se reemplaza este YAML, se regeneran los DTO y se ajusta
# solo el adaptador del destino TERCERO. Producer, consumer, estado en DynamoDB y
# reconciliador no cambian.
#
# Diseñado para ser DISTINTO al banco y al ERP (así se prueba que cada destino
# tiene su propio mapeo):
#   - Unicidad por header Idempotency-Key (como el banco).
#   - Monto como TEXTO decimal "150.75" (como el ERP).
#   - Nombres en inglés, camelCase, con periodo "YYYY-MM".
# DTO: generar SOLO modelos (sin interfaces de API), sufijo Dto.
# =============================================================================
openapi: 3.0.3

info:
  title: Third Payments Simulator API
  version: 0.1.0-provisional
  description: |
    Sistema externo adicional que recibe los pagos cobrados por la Oficina del Agua.

    **Autenticación:** header `x-api-key`.
    **Idempotencia:** header `Idempotency-Key` (8-64 caracteres, `^[A-Za-z0-9_-]+$`).
    Reenviar el mismo pago con la misma llave devuelve `409 DUPLICATE_PAYMENT`
    (equivale a "ya entregado"). Misma llave con datos distintos devuelve
    `409 IDEMPOTENCY_KEY_REUSED` (error del productor, no se reintenta).

    **Reintentos:** `429, 500, 502, 503, 504` y timeouts sí; `400, 403, 409 REUSED, 422` no.
    **Timeouts recomendados:** connect 2 s, read 3 s.

servers:
  - url: http://localhost:8089
    description: Mock local (mock_third_api.py)
  - url: https://REEMPLAZAR_API_ID.execute-api.us-east-1.amazonaws.com/prod
    description: Real (cuando exista)

security:
  - ApiKeyAuth: []

paths:
  /third/v1/payments:
    post:
      tags: [ThirdPayments]
      operationId: sendThirdPayment
      summary: Registrar un pago
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SimulationScenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThirdPaymentRequest'
            example:
              teamCode: EQUIPO_A
              reference: REC-2026-000123
              customer: { code: CLI-0001, name: Ana López }
              amount: '150.75'
              currency: GTQ
              paidAt: '2026-10-01T10:15:00-06:00'
              method: CASH
              period: 2026-09
      responses:
        '201':
          description: Pago registrado. **No reintentar.**
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThirdReceipt'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /third/v1/payments/{idempotencyKey}:
    get:
      tags: [ThirdPayments]
      operationId: getThirdPayment
      summary: Consultar si un pago ya fue registrado (reconciliación)
      description: Solo devuelve pagos del equipo dueño de la API key.
      parameters:
        - name: idempotencyKey
          in: path
          required: true
          schema: { type: string, minLength: 8, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Ya registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThirdReceipt'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No existe un pago con esa llave para este equipo. **No reintentar la consulta.**
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThirdError'
        '503': { $ref: '#/components/responses/Unavailable' }

  /third/v1/health:
    get:
      tags: [ThirdHealth]
      operationId: getThirdHealth
      summary: Estado del servicio (no requiere API key)
      security: []
      responses:
        '200':
          description: Disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
      example: EQA-000123
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, maxLength: 64 }
    SimulationScenario:
      name: X-Simulation-Scenario
      in: header
      required: false
      description: Solo pruebas. Fuerza un escenario de fallo.
      schema:
        type: string
        enum: [AUTO, SUCCESS, SLOW, TIMEOUT, LOST_ACK, ERROR_500, ERROR_503, RATE_LIMIT]

  responses:
    ValidationError:
      description: El request no cumple el contrato. **No reintentar.**
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ThirdError' }
    Forbidden:
      description: API key inválida o `teamCode` no corresponde a la llave (`TEAM_MISMATCH`). **No reintentar.**
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ThirdError' }
    Conflict:
      description: |
        `DUPLICATE_PAYMENT`: mismo pago ya registrado (tratar como entregado).
        `IDEMPOTENCY_KEY_REUSED`: misma llave con datos distintos (no reintentar).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ThirdError' }
    BusinessRule:
      description: Regla de negocio incumplida (`AMOUNT_LIMIT_EXCEEDED`, `PAYMENT_DATE_IN_FUTURE`). **No reintentar.**
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ThirdError' }
    RateLimited:
      description: Demasiadas peticiones. Reintentar respetando `Retry-After`.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ThirdError' }
    InternalError:
      description: Error interno; el pago **no** se registró. Reintentar con backoff.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ThirdError' }
    Unavailable:
      description: Servicio no disponible; el pago **no** se registró. Reintentar respetando `Retry-After`.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ThirdError' }

  schemas:
    TeamCode:
      type: string
      enum: [EQUIPO_A, EQUIPO_B, EQUIPO_C, EQUIPO_D]

    ThirdPaymentRequest:
      type: object
      required: [teamCode, reference, customer, amount, currency, paidAt, method, period]
      properties:
        teamCode: { $ref: '#/components/schemas/TeamCode' }
        reference:
          type: string
          maxLength: 30
          description: Número de recibo en el sistema origen.
        customer: { $ref: '#/components/schemas/ThirdCustomer' }
        amount:
          type: string
          pattern: '^[0-9]{1,8}\.[0-9]{2}$'
          description: Decimal con exactamente 2 decimales. Máximo 25000.00.
          example: '150.75'
        currency: { type: string, enum: [GTQ] }
        paidAt: { type: string, format: date-time }
        method: { type: string, enum: [CASH, CARD] }
        period:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          description: Período facturado, `YYYY-MM`.
        notes: { type: string, maxLength: 140 }

    ThirdCustomer:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        name: { type: string, maxLength: 150 }

    ThirdReceipt:
      type: object
      required: [confirmationId, idempotencyKey, teamCode, status, amount, receivedAt]
      properties:
        confirmationId: { type: string, example: THR-20261021-8F3K2Q }
        idempotencyKey: { type: string }
        teamCode: { $ref: '#/components/schemas/TeamCode' }
        status: { type: string, enum: [ACCEPTED] }
        amount: { type: string, example: '150.75' }
        receivedAt: { type: string, format: date-time }

    ThirdError:
      type: object
      required: [status, code, message, retryable]
      properties:
        status: { type: integer }
        code:
          type: string
          description: |
            VALIDATION_ERROR, TEAM_MISMATCH, UNAUTHORIZED, DUPLICATE_PAYMENT,
            IDEMPOTENCY_KEY_REUSED, AMOUNT_LIMIT_EXCEEDED, PAYMENT_DATE_IN_FUTURE,
            PAYMENT_NOT_FOUND, RATE_LIMITED, INTERNAL_ERROR, SERVICE_UNAVAILABLE
        message: { type: string }
        retryable: { type: boolean, description: Pista; decidir por el código HTTP. }
        correlationId: { type: string }
        timestamp: { type: string, format: date-time }
        originalConfirmation:
          allOf: [ { $ref: '#/components/schemas/ThirdReceipt' } ]
          description: Presente en `DUPLICATE_PAYMENT`.

    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [UP] }
        service: { type: string }
        time: { type: string, format: date-time }
