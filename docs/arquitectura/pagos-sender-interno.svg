<text x="948" y="354.375" text-anchor="middle" font-size="12.5">DeliveryProcessor</text>
<text x="948" y="370.875" text-anchor="middle" font-size="12.5">reclama → mapea → valida</text>
<text x="948" y="387.375" text-anchor="middle" font-size="12.5">→ envía → clasifica</text>
<rect x="850" y="446" width="196" height="104" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/>
