<text x="660" y="572.125" text-anchor="middle" font-size="12.5">cada 1 min: vencidos (GSI)</text>
<text x="660" y="588.625" text-anchor="middle" font-size="12.5">cada 10 min: barrido de</text>
<text x="660" y="605.125" text-anchor="middle" font-size="12.5">pagos sin entrega en MariaDB</text>
<rect x="850" y="290" width="196" height="120" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/>
