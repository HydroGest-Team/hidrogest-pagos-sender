<text x="371" y="164.625" text-anchor="middle" font-size="12.5">cada 10 s · lote 200</text>
<text x="371" y="181.125" text-anchor="middle" font-size="12.5">cursor updated_at − 10 min</text>
<rect x="530" y="110" width="260" height="130" rx="8" fill="#fffde7" stroke="#b28704" stroke-width="1.8"/>
<text x="660" y="146.375" text-anchor="middle" font-size="12.5" font-weight="700">DynamoDB</text>
<text x="660" y="162.875" text-anchor="middle" font-size="12.5">pagos_entregas (pago, destino)</text>
<text x="660" y="179.375" text-anchor="middle" font-size="12.5">  + GSI abiertos-index</text>
<text x="660" y="195.875" text-anchor="middle" font-size="12.5">pagos_intentos (bitácora)</text>
<text x="660" y="212.375" text-anchor="middle" font-size="12.5">pagos_control (cursor)</text>
<rect x="530" y="290" width="260" height="196" rx="8" fill="#fffde7" stroke="#b28704" stroke-width="1.8"/>
<text x="660" y="342.875" text-anchor="middle" font-size="12.5" font-weight="700">RabbitMQ</text>
