<text x="660" y="375.875" text-anchor="middle" font-size="12.5">pagos.banco · .erp · .tercero</text>
<text x="660" y="392.375" text-anchor="middle" font-size="12.5">  colas quorum, ack manual</text>
<text x="660" y="408.875" text-anchor="middle" font-size="12.5">pagos.&lt;d&gt;.retry.5s/30s/2m/10m</text>
<text x="660" y="425.375" text-anchor="middle" font-size="12.5">  TTL → vuelve a la cola</text>
<text x="660" y="441.875" text-anchor="middle" font-size="12.5">pagos.dlx → pagos.&lt;d&gt;.dlq</text>
<rect x="530" y="534" width="260" height="84" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/>
