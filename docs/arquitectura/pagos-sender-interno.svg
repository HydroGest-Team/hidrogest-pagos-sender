<text x="948" y="485.875" text-anchor="middle" font-size="12.5">Banco · ERP · Tercero</text>
<text x="948" y="502.375" text-anchor="middle" font-size="12.5">Feign (sin reintentos)</text>
<text x="948" y="518.875" text-anchor="middle" font-size="12.5">circuit breaker por destino</text>
<text x="948" y="535.375" text-anchor="middle" font-size="12.5">timeouts 2 s / 3 s</text>
<rect x="266" y="566" width="210" height="56" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/>
<text x="371" y="590.125" text-anchor="middle" font-size="12.5" font-weight="700">AdminController</text>
<text x="371" y="606.625" text-anchor="middle" font-size="12.5">/admin/* · Basic Auth</text>
